<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" font-family="Arial, Helvetica, sans-serif">
  <rect width="920" height="520" fill="#ffffff"/>
  <rect x="10" y="10" width="900" height="500" rx="14" fill="#f7f9fc" stroke="#7f8fa6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="28" y="34" font-size="15" font-weight="bold" fill="#1f3864">Host laptop: Windows 11 Home + Oracle VirtualBox 7.2</text>

  <!-- internet + browser -->
  <rect x="330" y="48" width="260" height="44" rx="8" fill="#eef3fb" stroke="#1f3864"/>
  <text x="460" y="67" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f3864">Internet</text>
  <text x="460" y="84" font-size="12" text-anchor="middle" fill="#333">(VirtualBox NAT, used for installs)</text>
  <rect x="650" y="48" width="230" height="44" rx="8" fill="#eef3fb" stroke="#1f3864"/>
  <text x="765" y="67" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f3864">Host browser + PowerShell (SSH)</text>
  <text x="765" y="84" font-size="12" text-anchor="middle" fill="#333">used to manage osTicket</text>

  <!-- VMs -->
  <rect x="40" y="170" width="240" height="140" rx="10" fill="#e8f0fe" stroke="#1f3864" stroke-width="2"/>
  <text x="160" y="196" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f3864">DC01</text>
  <text x="160" y="216" font-size="12" text-anchor="middle">Windows Server 2022</text>
  <text x="160" y="234" font-size="12" text-anchor="middle">192.168.10.10</text>
  <text x="160" y="254" font-size="12" text-anchor="middle">Active Directory (lab.local), DNS</text>
  <text x="160" y="272" font-size="12" text-anchor="middle">Group Policy, \\DC01\Sales share</text>
  <text x="160" y="290" font-size="12" text-anchor="middle">12 users, 3 groups, 5 OUs</text>

  <rect x="340" y="170" width="240" height="140" rx="10" fill="#e8f0fe" stroke="#1f3864" stroke-width="2"/>
  <text x="460" y="196" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f3864">CLIENT01</text>
  <text x="460" y="216" font-size="12" text-anchor="middle">Windows 11 Enterprise (eval)</text>
  <text x="460" y="234" font-size="12" text-anchor="middle">192.168.10.20</text>
  <text x="460" y="254" font-size="12" text-anchor="middle">Joined to lab.local</text>
  <text x="460" y="272" font-size="12" text-anchor="middle">Receives Group Policy</text>
  <text x="460" y="290" font-size="12" text-anchor="middle">Used to test user problems</text>

  <rect x="640" y="170" width="240" height="140" rx="10" fill="#e8f0fe" stroke="#1f3864" stroke-width="2"/>
  <text x="760" y="196" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f3864">TICKET01</text>
  <text x="760" y="216" font-size="12" text-anchor="middle">Ubuntu Server 22.04</text>
  <text x="760" y="234" font-size="12" text-anchor="middle">192.168.10.30</text>
  <text x="760" y="254" font-size="12" text-anchor="middle">osTicket 1.18 (Apache, PHP, MySQL)</text>
  <text x="760" y="272" font-size="12" text-anchor="middle">Help desk ticket system</text>
  <text x="760" y="290" font-size="12" text-anchor="middle">10 tickets logged and closed</text>

  <!-- NAT / forwarding lines -->
  <line x1="460" y1="92" x2="460" y2="170" stroke="#555" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="452" y="132" font-size="11" fill="#555" text-anchor="end">NAT (adapter 2)</text>
  <path d="M590 70 L615 70 L615 200 L640 200" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="608" y="150" font-size="11" fill="#555" text-anchor="end">NAT (adapter 1)</text>
  <line x1="765" y1="92" x2="765" y2="170" stroke="#c0392b" stroke-width="2"/>
  <text x="775" y="116" font-size="11" fill="#c0392b">port forward from host:</text>
  <text x="775" y="130" font-size="11" fill="#c0392b">8080 to 80 (web)</text>
  <text x="775" y="144" font-size="11" fill="#c0392b">2222 to 22 (SSH)</text>

  <!-- labnet bus -->
  <line x1="160" y1="310" x2="160" y2="372" stroke="#1f3864" stroke-width="3"/>
  <line x1="460" y1="310" x2="460" y2="372" stroke="#1f3864" stroke-width="3"/>
  <line x1="760" y1="310" x2="760" y2="372" stroke="#1f3864" stroke-width="3"/>
  <line x1="100" y1="372" x2="820" y2="372" stroke="#1f3864" stroke-width="6" stroke-linecap="round"/>
  <text x="460" y="402" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f3864">labnet: VirtualBox internal network, 192.168.10.0/24</text>
  <text x="460" y="422" font-size="12" text-anchor="middle" fill="#333">DNS and domain traffic between the three VMs. No gateway: the lab is isolated.</text>

  <text x="460" y="470" font-size="12" text-anchor="middle" fill="#555">Simulated environment for practice. Evaluation licenses. No real company or personal data.</text>
</svg>
